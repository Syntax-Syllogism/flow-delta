# Publishes to npm when bin/publish.sh pushes the `release` branch.
# Uses npm provenance (OIDC) — no NPM_TOKEN secret required if the package is
# configured for trusted publishing; otherwise add NPM_TOKEN and a
# `- run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc` step.
name: Publish to npm

on:
  push:
    branches: [release]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # OIDC trusted publishing authenticates via the npm CLI, which needs
      # >= 11.5.1. Node 22 bundles npm 10.x, so we need a newer npm.
      #
      # We must NOT `npm install -g npm@latest`: the Node toolcache image ships
      # a broken bundled npm whose internal dependency tree is missing modules
      # (e.g. `sigstore`, required by `npm publish --provenance`). Upgrading in
      # place runs through that same broken npm and reproduces the corruption,
      # so the publish later fails with `Cannot find module 'sigstore'`.
      # corepack fetches a clean npm from the registry and shims it, bypassing
      # the defective toolcache npm. See actions/runner-images#13883.
      - name: Activate a clean npm via corepack
        run: |
          corepack enable
          corepack prepare npm@11.5.1 --activate
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Publish to npm
        run: npm publish --access public --provenance
