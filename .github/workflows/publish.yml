# Publishes to npm when bin/publish.sh pushes the `release` branch.
# Uses npm provenance (OIDC) — no NPM_TOKEN secret required if the package is
# configured for trusted publishing; otherwise add NPM_TOKEN and a
# `- run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc` step.
name: Publish to npm

on:
  push:
    branches: [release]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # OIDC trusted publishing authenticates via the npm CLI, which needs
      # >= 11.5.1. Node 22 bundles npm 10.x, so upgrade before publishing.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Publish to npm
        run: npm publish --access public --provenance
